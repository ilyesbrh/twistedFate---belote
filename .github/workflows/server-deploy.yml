name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # github.repository preserves the original case (twistedFate-belote);
  # docker image refs must be lowercase. Hardcoded to avoid downstream pulls
  # failing with "invalid reference format".
  IMAGE_NAME: ilyesbrh/twistedfate-belote

jobs:
  # ── Quality gates: must pass before we even build the image ────────────────
  ci:
    name: ci checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      - name: format check
        run: pnpm format:check

  # ── Build + push the docker image to GHCR ──────────────────────────────────
  build-image:
    name: build & push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - name: build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BASE_PATH=/
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to the host: ship compose file + .env, then `up -d` ─────────────
  deploy:
    name: ssh deploy
    needs: build-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: install deploy ssh key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: deploy
        env:
          REMOTE: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-image.outputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ssh "$REMOTE" 'mkdir -p /opt/belote'
          scp deploy/docker-compose.yml "$REMOTE:/opt/belote/docker-compose.yml"

          ssh "$REMOTE" "printf 'IMAGE_REF=%s\n' '$IMAGE_REF' > /opt/belote/.env"

          # Pipe the token via stdin so it never appears in the remote
          # command line / process list. --password-stdin reads it from FD0.
          printf '%s' "$GHCR_TOKEN" | ssh "$REMOTE" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          ssh "$REMOTE" "cd /opt/belote && docker compose pull && docker compose up -d && docker image prune -f"

      - name: smoke check
        env:
          REMOTE: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh "$REMOTE" "curl --fail --silent --show-error --max-time 10 http://127.0.0.1:4100/health"
