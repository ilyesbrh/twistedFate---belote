<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base: warm muted backdrop with a soft radial highlight at the top.
         Tone is between "aged linen" and "card-table felt"; calm enough to
         sit behind cards without competing. -->
    <radialGradient id="base" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#e9d9b4"/>
      <stop offset="55%" stop-color="#d8c693"/>
      <stop offset="100%" stop-color="#b09a64"/>
    </radialGradient>

    <!-- Argyle / diamond-lattice pattern: classic card-back motif drawn
         once at modest opacity so it reads as "designed" but not busy. -->
    <pattern id="lattice" patternUnits="userSpaceOnUse" width="80" height="80">
      <path d="M 0 40 L 40 0 L 80 40 L 40 80 Z"
            fill="none" stroke="#6a4a28" stroke-width="1.1" opacity="0.18"/>
      <circle cx="40" cy="40" r="1.6" fill="#6a4a28" opacity="0.32"/>
      <circle cx="0"  cy="40" r="1.2" fill="#6a4a28" opacity="0.22"/>
      <circle cx="80" cy="40" r="1.2" fill="#6a4a28" opacity="0.22"/>
      <circle cx="40" cy="0"  r="1.2" fill="#6a4a28" opacity="0.22"/>
      <circle cx="40" cy="80" r="1.2" fill="#6a4a28" opacity="0.22"/>
    </pattern>

    <!-- Edge vignette so the centre stays bright. -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
      <stop offset="60%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(40,28,12,0.3)"/>
    </radialGradient>
  </defs>

  <!-- Solid base -->
  <rect width="1920" height="1080" fill="url(#base)"/>
  <!-- Pattern -->
  <rect width="1920" height="1080" fill="url(#lattice)"/>

  <!-- Thin double-line frame inset from the edges. Quiet, classic. -->
  <rect x="40" y="40" width="1840" height="1000" rx="14" ry="14"
        fill="none" stroke="#6a4a28" stroke-width="2" opacity="0.55"/>
  <rect x="56" y="56" width="1808" height="968" rx="10" ry="10"
        fill="none" stroke="#6a4a28" stroke-width="1" opacity="0.35"/>

  <!-- Outer vignette -->
  <rect width="1920" height="1080" fill="url(#vignette)" pointer-events="none"/>
</svg>
