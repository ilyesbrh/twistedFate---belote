<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Hand-drawn imperfection filter — slightly displaces lines so they
         feel inked rather than printed. Subtle so it doesn't ruin alignment. -->
    <filter id="rough" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="1" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>

    <filter id="rough-strong" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6"/>
    </filter>

    <!-- Cream paper base with warm radial highlight -->
    <radialGradient id="paper" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#fbf3da"/>
      <stop offset="55%" stop-color="#f3e9cf"/>
      <stop offset="100%" stop-color="#e6d4a8"/>
    </radialGradient>

    <!-- Diagonal grain pattern, very faint -->
    <pattern id="grain" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(28)">
      <rect width="14" height="14" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="rgba(112,78,32,0.045)" stroke-width="1"/>
    </pattern>

    <!-- Paper-fiber speckle for extra texture -->
    <filter id="paper-fiber">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="5"/>
      <feColorMatrix values="0 0 0 0 0.165
                             0 0 0 0 0.122
                             0 0 0 0 0.07
                             0 0 0 0.06 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Reusable suit glyphs — drawn as ink stamps -->
    <symbol id="pip-spade" viewBox="0 0 32 32">
      <path d="M16 3 C 11 9 5 13 5 19 c 0 4 3 7 7 7 c 1.6 0 2.7 -0.6 3.4 -1.6 c -0.4 1.5 -1 2.9 -2 4.1 c -0.5 0.6 -0.1 1.5 0.7 1.5 h 5.8 c 0.8 0 1.2 -0.9 0.7 -1.5 c -1 -1.2 -1.6 -2.6 -2 -4.1 c 0.7 1 1.8 1.6 3.4 1.6 c 4 0 7 -3 7 -7 c 0 -6 -6 -10 -11 -16 z"/>
    </symbol>
    <symbol id="pip-heart" viewBox="0 0 32 32">
      <path d="M16 28 C 6 21 3 14 3 10 C 3 6 6 3 10 3 c 2.4 0 4.6 1.4 6 3.6 C 17.4 4.4 19.6 3 22 3 c 4 0 7 3 7 7 c 0 4 -3 11 -13 18 z"/>
    </symbol>
    <symbol id="pip-diamond" viewBox="0 0 32 32">
      <path d="M16 2 C 14 8 10 12 4 16 C 10 20 14 24 16 30 C 18 24 22 20 28 16 C 22 12 18 8 16 2 z"/>
    </symbol>
    <symbol id="pip-club" viewBox="0 0 32 32">
      <circle cx="16" cy="9" r="5"/>
      <circle cx="9" cy="18" r="5"/>
      <circle cx="23" cy="18" r="5"/>
      <path d="M14 19 c 0 5 -1 7 -3 9 c -0.6 0.6 -0.1 1.5 0.7 1.5 h 8.6 c 0.8 0 1.3 -0.9 0.7 -1.5 c -2 -2 -3 -4 -3 -9 z"/>
    </symbol>
  </defs>

  <!-- Paper base -->
  <rect width="1920" height="1080" fill="url(#paper)"/>
  <rect width="1920" height="1080" fill="url(#grain)"/>
  <rect width="1920" height="1080" fill="rgba(0,0,0,0)" filter="url(#paper-fiber)" opacity="0.4"/>

  <!-- Corner suit watermarks (very faint, large) -->
  <g opacity="0.08" fill="#2a1f12">
    <use href="#pip-spade" x="-90" y="-60" width="380" height="380" transform="rotate(-12 100 130)"/>
    <use href="#pip-heart" x="1660" y="-50" width="360" height="360" transform="rotate(14 1840 130)"/>
    <use href="#pip-diamond" x="-80" y="780" width="360" height="360" transform="rotate(8 100 960)"/>
    <use href="#pip-club" x="1660" y="780" width="360" height="360" transform="rotate(-10 1840 960)"/>
  </g>

  <!-- Outer ornamental border (heavy ink) -->
  <g fill="none" stroke="#2a1f12" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
    <rect x="40" y="40" width="1840" height="1000" rx="22" ry="22" stroke-width="6"/>
    <rect x="62" y="62" width="1796" height="956" rx="14" ry="14" stroke-width="2" stroke-dasharray="2 8"/>
  </g>

  <!-- Decorative corner flourishes -->
  <g fill="none" stroke="#2a1f12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
    <!-- Top-left -->
    <path d="M 80 86 q 56 -22 110 0"/>
    <path d="M 86 80 q -22 56 0 110"/>
    <circle cx="86" cy="86" r="3" fill="#2a1f12" stroke="none"/>
    <!-- Top-right -->
    <path d="M 1840 86 q -56 -22 -110 0"/>
    <path d="M 1834 80 q 22 56 0 110"/>
    <circle cx="1834" cy="86" r="3" fill="#2a1f12" stroke="none"/>
    <!-- Bottom-left -->
    <path d="M 80 994 q 56 22 110 0"/>
    <path d="M 86 1000 q -22 -56 0 -110"/>
    <circle cx="86" cy="994" r="3" fill="#2a1f12" stroke="none"/>
    <!-- Bottom-right -->
    <path d="M 1840 994 q -56 22 -110 0"/>
    <path d="M 1834 1000 q 22 -56 0 -110"/>
    <circle cx="1834" cy="994" r="3" fill="#2a1f12" stroke="none"/>
  </g>

  <!-- ── Center compass medallion ────────────────────────────────────────── -->
  <!-- Soft cream halo so the trick area stands out from the paper -->
  <radialGradient id="medallion" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fdf6e0" stop-opacity="1"/>
    <stop offset="80%" stop-color="#fdf6e0" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#fdf6e0" stop-opacity="0"/>
  </radialGradient>
  <circle cx="960" cy="540" r="380" fill="url(#medallion)"/>

  <!-- Concentric ink rings -->
  <g fill="none" stroke="#2a1f12" stroke-linecap="round" filter="url(#rough)">
    <circle cx="960" cy="540" r="320" stroke-width="3"/>
    <circle cx="960" cy="540" r="304" stroke-width="1" stroke-dasharray="3 9"/>
    <circle cx="960" cy="540" r="232" stroke-width="2" stroke-dasharray="1 7"/>
    <circle cx="960" cy="540" r="168" stroke-width="1.5"/>
  </g>

  <!-- Suit pips at compass points (N spade, E heart, S diamond, W club) -->
  <g fill="#2a1f12" filter="url(#rough)">
    <!-- North: spade -->
    <use href="#pip-spade" x="932" y="240" width="56" height="56"/>
    <!-- East: heart (terracotta) -->
    <use href="#pip-heart" x="1232" y="512" width="56" height="56" fill="#a83232"/>
    <!-- South: diamond (terracotta) -->
    <use href="#pip-diamond" x="932" y="784" width="56" height="56" fill="#a83232"/>
    <!-- West: club -->
    <use href="#pip-club" x="632" y="512" width="56" height="56"/>
  </g>

  <!-- Vignette so cards always read clearly -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
    <stop offset="50%" stop-color="rgba(0,0,0,0)"/>
    <stop offset="100%" stop-color="rgba(42,31,18,0.2)"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
