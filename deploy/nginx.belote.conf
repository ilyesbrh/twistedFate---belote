# Nginx site for belote.3btechsolutions.com
# Drop into /etc/nginx/sites-available/belote.3btechsolutions.com
# Then: ln -s ../sites-available/belote.3btechsolutions.com /etc/nginx/sites-enabled/
# Test: nginx -t  &&  systemctl reload nginx
#
# After installing, run certbot to add HTTPS:
#   certbot --nginx -d belote.3btechsolutions.com

upstream belote_app {
  server 127.0.0.1:4100;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name belote.3btechsolutions.com;

  # ── Static + SPA fallback are handled by the app process via Fastify, so
  # nginx is a thin reverse proxy here. WebSocket upgrade is mandatory.
  location / {
    proxy_pass         http://belote_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket upgrade — required for /ws (online play).
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Long-lived ws connections need a generous read timeout.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Lightweight health probe — doesn't touch the upstream's logger noisily.
  location = /health {
    access_log off;
    proxy_pass http://belote_app/health;
  }

  # Aggressive caching for hashed static assets only (vite emits files with
  # content hashes under /assets/).
  location ~* ^/assets/ {
    proxy_pass http://belote_app;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }
}
